    <script>
        const seoData = { general: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" }, projets: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" }, colline: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" } };
        
        let allProjects = []; 
        let currentProjectId = null; 
        
        let allTeamMembers = [];
        let currentTeamIndex = 0;
        
        let sortDirection = 1;
        let currentSortColumn = 'id';
        
        let hashBtn1 = 'projets';
        let hashBtn2 = 'colline';
        
        let currentLightboxIndex = 0;
        let lastHashBeforeIntro = '';
        
        let savedScrollPosition = 0;
        let textBtnRetour = "RETOUR";
        let vignettesScrollTimer = null;

        function lockScroll() {
            savedScrollPosition = window.scrollY;
            document.body.style.position = 'fixed';
            document.body.style.top = `-${savedScrollPosition}px`;
            document.body.style.width = '100%';
        }

        function unlockScroll() {
            document.body.style.position = '';
            document.body.style.top = '';
            document.body.style.width = '';
            window.scrollTo(0, savedScrollPosition);
        }

        // GESTION DU SWIPE TACTILE UNIQUEMENT SUR LES LIGHTBOXES
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe(e);
        }, {passive: true});

        function handleSwipe(e) {
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
                const lightbox = document.getElementById('lightbox');
                if (lightbox && lightbox.classList.contains('active')) {
                    if (diffX < 0) moveLightbox(1); 
                    if (diffX > 0) moveLightbox(-1); 
                    return;
                }
                
                const teamLightbox = document.getElementById('team-lightbox');
                if (teamLightbox && teamLightbox.classList.contains('active')) {
                    if (diffX < 0) moveTeamLightbox(1); 
                    if (diffX > 0) moveTeamLightbox(-1); 
                    return;
                }
            }
        }
        
        function slugify(text) {
            return text.toString().toLowerCase()
                .normalize('NFD') 
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-') 
                .replace(/[^\w\-]+/g, '') 
                .replace(/\-\-+/g, '-') 
                .replace(/^-+/, '') 
                .replace(/-+$/, ''); 
        }

        function showIntro() {
            const introScreen = document.getElementById('intro-screen');
            let introBg = document.getElementById('intro-bg');
            const introLogo = document.getElementById('intro-logo-container');
            const introEnterBtn = document.getElementById('intro-enter-btn');
            const sidebarLogo = document.getElementById('sidebar-logo');
            const introMask = introLogo.querySelector('.mask-logo');
            const introBand = document.getElementById('intro-band');
            
            lastHashBeforeIntro = window.location.hash;
            history.pushState(null, null, window.location.pathname);
            document.body.classList.add('no-scroll');
            
            if (introBg) introBg.style.transition = 'none';
            introLogo.style.transition = 'none';
            introMask.style.transition = 'none';
            introLogo.style.opacity = '0'; 
            introBand.style.transition = 'none';
            introBand.style.opacity = '0';
            
            if (introEnterBtn) {
                introEnterBtn.style.transition = 'none';
                introEnterBtn.style.opacity = '0';
            }
            
            introScreen.style.display = 'flex';
            introScreen.style.backgroundColor = 'transparent'; 

            fetch('Texte/accueil.txt').then(r => r.text()).then(text => {
                const match = text.match(/Nombre de couvertures\s*:\s*(\d+)/i);
                const nbCouv = match ? parseInt(match[1]) : 1;
                const rand = Math.floor(Math.random() * nbCouv) + 1;
                
                if (introBg && rand !== 1) {
                    introBg.classList.remove('loaded');
                    introBg.dataset.tried = '';
                    introBg.src = `Images/Couverture/${rand}.webp`;
                }
            }).catch(e => {});

            introLogo.style.transform = 'none'; 
            introLogo.style.width = '16.36rem'; 

            setTimeout(() => {
                const sRect = sidebarLogo.getBoundingClientRect();
                const iRect = introLogo.getBoundingClientRect();
                const tx = sRect.left - iRect.left;
                const ty = sRect.top - iRect.top;

                if (introBg) introBg.style.transform = 'translateX(-100vw)';
                introLogo.style.transform = `translate(${tx}px, ${ty}px)`;
                introLogo.style.width = `${sRect.width}px`;
                introMask.classList.add('align-left');
                
                introLogo.style.opacity = '1';
                sidebarLogo.style.opacity = '0';
                
                void introScreen.offsetWidth; 
                
                setTimeout(() => {
                    if (introBg) introBg.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    introLogo.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), width 0.8s';
                    introMask.style.transition = 'background-color 0.3s ease, -webkit-mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1), mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    introBand.style.transition = 'opacity 0.8s ease';
                    
                    if (introBg) introBg.style.transform = 'translateX(0)';
                    introLogo.style.transform = 'none';
                    introLogo.style.width = '16.36rem';
                    introMask.classList.remove('align-left');
                    introBand.style.opacity = '1';
                    
                    if (introEnterBtn) {
                        introEnterBtn.style.transition = 'color 0.3s ease, opacity 0.8s ease';
                        introEnterBtn.style.opacity = '1';
                    }

                    setTimeout(() => {
                        introScreen.style.backgroundColor = 'var(--color-fond)';
                    }, 800);
                }, 20); 
            }, 10);
        }

        function playIntro() {
            const introScreen = document.getElementById('intro-screen');
            const introBg = document.getElementById('intro-bg');
            const introLogo = document.getElementById('intro-logo-container');
            const introEnterBtn = document.getElementById('intro-enter-btn');
            const sidebarLogo = document.getElementById('sidebar-logo');
            const introMask = introLogo.querySelector('.mask-logo');
            const introBand = document.getElementById('intro-band');
            
            if (!introScreen || introScreen.style.display === 'none') return;
            
            introScreen.style.backgroundColor = 'transparent';

            if (introBg) introBg.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            introLogo.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), width 0.8s';
            introMask.style.transition = 'background-color 0.3s ease, -webkit-mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1), mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            introBand.style.transition = 'opacity 0.5s ease';
            
            if (introEnterBtn) {
                introEnterBtn.style.transition = 'color 0.3s ease, opacity 0.5s ease';
                introEnterBtn.style.opacity = '0';
            }

            const sRect = sidebarLogo.getBoundingClientRect();
            const iRect = introLogo.getBoundingClientRect();
            const tx = sRect.left - iRect.left;
            const ty = sRect.top - iRect.top;
            
            if (introBg) introBg.style.transform = 'translateX(-100vw)';
            introLogo.style.transform = `translate(${tx}px, ${ty}px)`;
            introLogo.style.width = `${sRect.width}px`; 
            introMask.classList.add('align-left');
            introBand.style.opacity = '0';
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                sidebarLogo.style.opacity = '1';
                document.body.classList.remove('no-scroll');
                
                if (lastHashBeforeIntro) {
                    history.replaceState(null, null, lastHashBeforeIntro);
                    lastHashBeforeIntro = '';
                } else if(!window.location.hash.replace('#', '')) {
                    history.replaceState(null, null, '#' + hashBtn1);
                }
                handleHash();
            }, 800); 
        }

        function loadSEO() {
            fetch('Texte/seo.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                const blocks = text.split('[');
                blocks.forEach(block => {
                    if(!block.trim()) return;
                    const pageMatch = block.match(/^([^\]]+)\]/);
                    if(pageMatch) {
                        const pageKey = pageMatch[1].toLowerCase().trim();
                        
                        const titleMatch = block.match(/Titre\s*:\s*(.+)/i);
                        const descMatch = block.match(/Description\s*:\s*(.+)/i);
                        const keysMatch = block.match(/Keywords\s*:\s*(.+)/i);
                        
                        const h1Match = block.match(/H1\s*:\s*(.+)/i);
                        const ogTitleMatch = block.match(/OG-Titre\s*:\s*(.+)/i);
                        const ogDescMatch = block.match(/OG-Description\s*:\s*(.+)/i);
                        const ogImageMatch = block.match(/OG-Image\s*:\s*(.+)/i);

                        if(!seoData[pageKey]) seoData[pageKey] = {};
                        
                        if(titleMatch) seoData[pageKey].title = titleMatch[1].trim();
                        if(descMatch) seoData[pageKey].desc = descMatch[1].trim();
                        if(keysMatch) seoData[pageKey].keys = keysMatch[1].trim();
                        if(h1Match) seoData[pageKey].h1 = h1Match[1].trim();
                        if(ogTitleMatch) seoData[pageKey].ogTitle = ogTitleMatch[1].trim();
                        if(ogDescMatch) seoData[pageKey].ogDesc = ogDescMatch[1].trim();
                        if(ogImageMatch) seoData[pageKey].ogImage = ogImageMatch[1].trim();
                    }
                });
                updateSEO();
            }).catch(e => console.log("Fichier seo.txt non trouvé."));
        }

        function updateSEO() {
            const currentHash = window.location.hash.replace('#', '');
            
            let currentPageKey = 'general';
            if (currentHash === hashBtn1) currentPageKey = 'projets';
            else if (currentHash === hashBtn2) currentPageKey = 'colline';
            else if (currentHash) currentPageKey = 'projets'; 
            
            const specific = seoData[currentPageKey] || {};
            const gen = seoData['general'] || {};
            
            const newTitle = specific.title || gen.title;
            const newDesc = specific.desc || gen.desc;
            const newKeys = specific.keys || gen.keys;
            const newH1 = specific.h1 || gen.h1 || newTitle;
            const newOgTitle = specific.ogTitle || specific.title || gen.ogTitle || gen.title;
            const newOgDesc = specific.ogDesc || specific.desc || gen.ogDesc || gen.desc;
            const newOgImage = specific.ogImage || gen.ogImage;

            if (newTitle) document.title = newTitle;
            if (newDesc) document.getElementById('meta-desc').setAttribute('content', newDesc);
            if (newKeys) document.getElementById('meta-keywords').setAttribute('content', newKeys);
            if (newH1) document.getElementById('dynamic-h1').innerText = newH1;
            if (newOgTitle) document.getElementById('og-title').setAttribute('content', newOgTitle);
            if (newOgDesc) document.getElementById('og-desc').setAttribute('content', newOgDesc);
            if (newOgImage) document.getElementById('og-image').setAttribute('content', newOgImage);
            document.getElementById('og-url').setAttribute('content', window.location.href);
        }

        function loadTypo() {
            fetch('Typo/recap_typo.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                
                const normalizeStr = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
                let fixedText = text.replace(/\r?\n\s*:/g, ' :').replace(/:\s*\r?\n\s*/g, ' : ');
                
                const mappings = { 
                    "menu principal": "nav", 
                    "bloc contact": "contact", 
                    "reseaux sociaux": "social", 
                    "texte philosophie": "slogan-philo", 
                    "texte projets": "slogan-projets",
                    "titre page": "page-title",
                    "en-tetes de section": "section-header", 
                    "sous-titres de projet": "project-sub", 
                    "points cles": "key-points", 
                    "corps de texte": "body-text", 
                    "nom du membre": "team-name", 
                    "biographie": "cv",
                    "copyright": "copyright",
                    "categorie fiche": "card-label",
                    "texte fiche": "card-value",
                    "tri projets": "sort-bar", 
                    "trie projets": "sort-bar",
                    "bouton retour": "btn-retour"
                };
                
                const parseWeight = (v) => { 
                    const lower = v.toLowerCase();
                    if (lower.includes('light')) return '300'; 
                    if (lower.includes('regular')) return '400'; 
                    if (lower.includes('bold')) return '700'; 
                    if (lower.includes('black')) return '900'; 
                    return '400'; 
                };
                
                let currentPrefix = null;
                
                fixedText.split('\n').forEach(line => {
                    if (!line.trim()) return;
                    
                    const cleanLine = normalizeStr(line);
                    let isSectionHeader = false;
                    let isProperty = false;
                    
                    for (const [key, prefix] of Object.entries(mappings)) { 
                        if (cleanLine.includes(key)) { 
                            currentPrefix = prefix; 
                            isSectionHeader = true;
                            break; 
                        } 
                    }
                    
                    if (cleanLine.includes("en-tetes (n°, titre...)") || cleanLine.includes("en-tetes (n, titre...)")) { currentPrefix = "table-header"; isSectionHeader = true; }
                    else if (cleanLine.includes("cellules classiques")) { currentPrefix = "table-cell"; isSectionHeader = true; }
                    else if (cleanLine.includes("titres du tableau")) { currentPrefix = "table-title"; isSectionHeader = true; }
                    
                    if (cleanLine.startsWith("-") || cleanLine.startsWith("police") || cleanLine.startsWith("taille") || cleanLine.startsWith("style")) {
                        isProperty = true;
                    }

                    if (!isSectionHeader && !isProperty) {
                        currentPrefix = null; 
                    }
                    
                    if (currentPrefix && isProperty) {
                        if (cleanLine.startsWith("- police") || cleanLine.startsWith("police")) {
                            const val = line.split(':')[1].trim(); 
                            const fontName = val.split(' ')[0].replace(/['"]/g, '');
                            const weight = parseWeight(val);
                            if (currentPrefix.startsWith("table-")) { 
                                document.documentElement.style.setProperty('--font-table', `'${fontName}', sans-serif`); 
                                if (currentPrefix === "table-header" || currentPrefix === "table-title") { 
                                    document.documentElement.style.setProperty('--weight-table-bold', weight); 
                                } else { 
                                    document.documentElement.style.setProperty('--weight-table', weight); 
                                } 
                            } 
                            else { 
                                document.documentElement.style.setProperty(`--font-${currentPrefix}`, `'${fontName}', sans-serif`); 
                                document.documentElement.style.setProperty(`--weight-${currentPrefix}`, weight); 
                            }
                        }
                        else if (cleanLine.startsWith("- taille") || cleanLine.startsWith("taille")) {
                            const size = cleanLine.match(/[\d.]+rem/);
                            if (size) document.documentElement.style.setProperty(`--size-${currentPrefix.startsWith("table-") ? "table" : currentPrefix}`, size[0]);
                        }
                        else if (cleanLine.startsWith("- style") || cleanLine.startsWith("style")) {
                            const val = cleanLine;
                            let target = currentPrefix.startsWith("table-") ? "table" : currentPrefix;
                            document.documentElement.style.setProperty(`--transform-${target}`, val.includes('majuscule') ? 'uppercase' : 'none');
                            document.documentElement.style.setProperty(`--style-${target}`, val.includes('italique') ? 'italic' : 'normal');
                        }
                    }
                });
            }).catch(e => console.log("Fichier recap_typo.txt non trouvé."));
        }

        function loadColors() {
            fetch('Couleur/couleur.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                text.split('\n').forEach(line => {
                    const parts = line.split(':');
                    if (parts.length >= 2) {
                        const name = parts[0].trim().toLowerCase();
                        let value = parts[1].trim().replace(/\s/g, ''); 
                        if (/^[0-9A-Fa-f]{3,6}$/.test(value)) value = '#' + value;
                        if (name.includes('cadre')) document.documentElement.style.setProperty('--color-cadre', value);
                        if (name.includes('action')) document.documentElement.style.setProperty('--color-action', value);
                        if (name.includes('fond')) document.documentElement.style.setProperty('--color-fond', value);
                        if (name.includes('texte')) document.documentElement.style.setProperty('--color-texte', value);
                        if (name.includes('titre')) document.documentElement.style.setProperty('--color-titre', value);
                    }
                });
            }).catch(e => console.log("Fichier couleur non trouvé."));
        }

        function loadContact() {
            fetch('Texte/contact.txt').then(r => r.text()).then(text => document.getElementById('dynamic-contact-info').innerHTML = text.replace(/\n/g, '<br>'));
        }
        
        function loadReseaux() {
            fetch('Texte/reseaux.txt?nocache=' + new Date().getTime())
            .then(r => r.text())
            .then(text => {
                let html = '';
                const regex = /([A-Z0-9\s]+)\r?\nLien\s*:\s*([^\r\n]+)\r?\nActivation\s*:\s*(oui|non)/gi;
                let match;
                while ((match = regex.exec(text)) !== null) {
                    const name = match[1].trim();
                    const link = match[2].trim();
                    const active = match[3].trim().toLowerCase();
                    if (active === 'oui' && name && name !== "Lien" && name !== "Activation") {
                        html += `<a href="${link}" target="_blank">${name}</a>`;
                    }
                }
                if (html !== '') {
                    document.getElementById('social-links-desktop').innerHTML = html;
                    document.getElementById('social-links-mobile').innerHTML = html;
                }
            }).catch(e => console.log("Fichier reseaux.txt non trouvé."));
        }

        function loadTeamProfiles() {
            fetch('Texte/equipe.txt').then(r => r.text()).then(text => {
                const container = document.getElementById('team-grid-container');
                container.innerHTML = "";
                allTeamMembers = [];
                let indexArray = 0;
                text.split(/Profil \d+/i).filter(b => b.trim() !== "").forEach((block, i) => {
                    const name = block.match(/prénom et nom\s*:\s*(.+)/i)?.[1] || "NOM";
                    const bio = block.match(/présentation\s*:\s*([\s\S]+)/i)?.[1] || "";
                    const indexProfil = i + 1;
                    
                    allTeamMembers.push({ name, bio, index: indexProfil });
                    
                    let formattedBio = bio.trim().split(/\r?\n\s*\r?\n/).map(p => `<p>${p.trim().replace(/\r?\n/g, '<br>')}</p>`).join('');

                    container.innerHTML += `
                        <div class="team-member" id="team-member-${indexProfil}" role="button" tabindex="0" onclick="openTeamLightbox(${indexArray})" onkeydown="if(event.key === 'Enter' || event.key === ' ') openTeamLightbox(${indexArray})">
                            <div class="blue-frame">
                                <div class="portrait-placeholder">
                                    <img src="Images/Equipe/Profil_${indexProfil}.webp" class="blur-load" onload="this.classList.add('loaded')" alt="Portrait de ${name}" loading="lazy" width="800" height="800" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.onerror=null; this.style.display='none'; this.parentNode.innerHTML='PHOTO ${indexProfil}';}">
                                </div>
                            </div>
                            <div class="member-name">${name}</div>
                            
                            <div class="expandable-wrapper">
                                <div class="expandable-content cv-content">
                                    <div class="member-cv">${formattedBio}</div>
                                </div>
                                <div class="expand-overlay mobile-only" role="button" tabindex="0" aria-label="Développer la section" onclick="toggleSection(this); event.stopPropagation();" onkeydown="if(event.key === 'Enter') { toggleSection(this); event.stopPropagation(); }">
                                    <div class="expand-gradient"></div>
                                    <div class="expand-btn">
                                        <div class="arrow-icon icon-down"></div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>`;
                    indexArray++;
                });
            });
        }

        function formatColumnParagraphs(rawText) {
            return rawText
                .trim()
                .split(/\r?\n\s*\r?\n/)
                .map(block => block.trim())
                .filter(Boolean)
                .map(block => `<p>${block.replace(/\r?\n/g, '<br>')}</p>`)
                .join('');
        }

        function parseMarkdownProject(id, mdText) {
            const titreMatch = mdText.match(/^#\s+(.+)$/m);
            const titre = titreMatch ? titreMatch[1].trim() : "";

            const h2Matches = [...mdText.matchAll(/^##\s+(.+)$/gm)];
            const subHeading = h2Matches.find(m => !m[1].trim().toLowerCase().startsWith("le projet"));
            const sousTitre = subHeading ? subHeading[1].trim() : "";

            const getMeta = (key) => {
                const regex = new RegExp(`^[-*]\\s+\\*\\*(?:${key})\\s*:?\\*\\*\\s*:?\\s*(.+)$`, 'im');
                const m = mdText.match(regex);
                return m ? m[1].trim() : "";
            };

            const nbImagesMatch = mdText.match(/Nombre\s*d['’]images\s*:\s*(\d+)/i);
            const nbImages = nbImagesMatch ? parseInt(nbImagesMatch[1], 10) : 3;

            let paragraphs = "";
            const projetSectionMatch = mdText.match(/##\s+Le Projet\s*([\s\S]+)$/i);
            
            if (projetSectionMatch) {
                let content = projetSectionMatch[1].trim();
                content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                content = content.replace(/\*(.*?)\*/g, '<em>$1</em>');
                
                // Groupage adaptatif du texte pour gérer 1 colonne, 2 colonnes, avec ou sans image
                let rawBlocks = content.split(/\r?\n\s*\r?\n/).map(b => b.trim()).filter(Boolean);
                let clusters = [];
                let currentCluster = { blocks: [], textLength: 0 };

                rawBlocks.forEach(block => {
                    if (block.startsWith('### ')) {
                        if (currentCluster.blocks.length > 0) clusters.push(currentCluster);
                        clusters.push({ blocks: [{ type: 'h3', raw: block }], textLength: 0, isHeading: true });
                        currentCluster = { blocks: [], textLength: 0 };
                    } else {
                        if (/^Image(?:\s+large)?\s*:\s*\d+/i.test(block)) {
                            const m = block.match(/^Image(\s+large)?\s*:\s*(\d+)(?:\s*\|\s*(.+))?/i);
                            currentCluster.blocks.push({
                                type: 'image',
                                isWide: Boolean(m[1]),
                                index: parseInt(m[2], 10),
                                caption: m[3] ? m[3].trim() : ""
                            });
                        } else if (/^[-*]\s+/.test(block)) {
                            currentCluster.blocks.push({ type: 'ul', raw: block });
                            currentCluster.textLength += block.length;
                        } else {
                            currentCluster.blocks.push({ type: 'p', raw: block });
                            currentCluster.textLength += block.length;
                        }
                    }
                });
                if (currentCluster.blocks.length > 0) clusters.push(currentCluster);

                let paragraphsHtml = "";
                clusters.forEach(cluster => {
                    if (cluster.isHeading) {
                        paragraphsHtml += cluster.blocks[0].raw.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
                        return;
                    }
                    
                    let wrapImages = "";
                    let wrapTexts = "";
                    let hasImage = false;
                    
                    cluster.blocks.forEach(b => {
                        if (b.type === 'image') {
                            hasImage = true;
                            let fig = `<figure class="project-inline-media${b.isWide ? ' wide' : ''}" onclick="openLightbox(${b.index})">
                                    <img src="Images/Projet/Projet ${id}/${b.index}.webp" alt="${b.caption || titre}" loading="lazy" width="800" height="600"
                                         onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.closest('figure').remove();}">
                                    ${b.caption ? `<figcaption>${b.caption}</figcaption>` : ''}
                                </figure>`;
                            wrapImages += fig;
                        } else if (b.type === 'ul') {
                            const listItems = b.raw.split(/\r?\n/)
                                .filter(l => /^[-*]\s+/.test(l.trim()))
                                .map(l => `<li>${l.trim().replace(/^[-*]\s+/, '')}</li>`)
                                .join('');
                            wrapTexts += `<ul>${listItems}</ul>`;
                        } else if (b.type === 'p') {
                            wrapTexts += `<p>${b.raw.replace(/\r?\n/g, '<br>')}</p>`;
                        }
                    });
                    
                    if (cluster.textLength > 400) {
                        // Texte long : 2 colonnes, respect de l'ordre d'origine
                        let htmlOrig = cluster.blocks.map(b => {
                            if (b.type === 'image') {
                                return `<figure class="project-inline-media${b.isWide ? ' wide' : ''}" onclick="openLightbox(${b.index})">
                                        <img src="Images/Projet/Projet ${id}/${b.index}.webp" alt="${b.caption || titre}" loading="lazy" width="800" height="600"
                                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.closest('figure').remove();}">
                                        ${b.caption ? `<figcaption>${b.caption}</figcaption>` : ''}
                                    </figure>`;
                            } else if (b.type === 'ul') {
                                const listItems = b.raw.split(/\r?\n/).filter(l => /^[-*]\s+/.test(l.trim())).map(l => `<li>${l.trim().replace(/^[-*]\s+/, '')}</li>`).join('');
                                return `<ul>${listItems}</ul>`;
                            } else {
                                return `<p>${b.raw.replace(/\r?\n/g, '<br>')}</p>`;
                            }
                        }).join('');
                        paragraphsHtml += `<div class="project-text-columns">${htmlOrig}</div>`;
                    } else if (hasImage) {
                        // Texte court + image : l'image flotte, le texte s'enroule
                        paragraphsHtml += `<div class="project-text-wrap clearfix">${wrapImages}${wrapTexts}</div>`;
                    } else {
                        // Texte court seul : pleine largeur pour éviter le vide
                        let htmlOrig = cluster.blocks.map(b => {
                            if (b.type === 'ul') {
                                const listItems = b.raw.split(/\r?\n/).filter(l => /^[-*]\s+/.test(l.trim())).map(l => `<li>${l.trim().replace(/^[-*]\s+/, '')}</li>`).join('');
                                return `<ul>${listItems}</ul>`;
                            } else {
                                return `<p>${b.raw.replace(/\r?\n/g, '<br>')}</p>`;
                            }
                        }).join('');
                        paragraphsHtml += `<div class="project-text-single">${htmlOrig}</div>`;
                    }
                });
                paragraphs = paragraphsHtml;
            }

            return {
                id: id.toString(),
                titre: titre,
                type: getMeta("Type"),
                annee: getMeta("Année|Annee"),
                lieu: getMeta("Lieu"),
                client: getMeta("Client"),
                etat: getMeta("État|Etat"),
                budget: getMeta("Budget"),
                surface: getMeta("Surface"),
                sousTitre: sousTitre,
                nbImages: nbImages,
                paragraphs: paragraphs
            };
        }

        async function loadMarkdownProjects(nbProjets = null) {
            if (nbProjets && nbProjets > 0) {
                const timestamp = Date.now();
                const requests = Array.from({ length: nbProjets }, (_, i) => {
                    const id = (i + 1).toString();
                    return fetch(`Texte/Projets/${id}.md?nocache=${timestamp}`)
                        .then(r => r.ok ? r.text() : null)
                        .then(mdText => {
                            if (mdText && !mdText.trim().startsWith('<!DOCTYPE') && !mdText.trim().startsWith('<html')) {
                                return parseMarkdownProject(id, mdText);
                            }
                            return null;
                        })
                        .catch(() => null);
                });
                const results = await Promise.all(requests);
                return results.filter(Boolean);
            }

            const projects = [];
            let id = 1;
            let consecutiveMisses = 0;

            while (consecutiveMisses < 2 && id <= 50) {
                try {
                    const response = await fetch(`Texte/Projets/${id}.md?nocache=${Date.now()}`);
                    if (response.ok) {
                        const mdText = await response.text();
                        if (!mdText.trim().startsWith('<!DOCTYPE') && !mdText.trim().startsWith('<html')) {
                            projects.push(parseMarkdownProject(id.toString(), mdText));
                            consecutiveMisses = 0;
                        } else {
                            consecutiveMisses++;
                        }
                    } else {
                        consecutiveMisses++;
                    }
                } catch (e) {
                    consecutiveMisses++;
                }
                id++;
            }
            return projects;
        }

        function handleHash() {
            let currentHash = window.location.hash.replace('#', '');
            if (!currentHash) {
                switchPage('projets', hashBtn1);
                return;
            }

            if (currentHash === hashBtn1) {
                switchPage('projets', hashBtn1);
            } else if (currentHash === hashBtn2) {
                switchPage('colline', hashBtn2);
            } else {
                const proj = allProjects.find(p => slugify(p.titre) === currentHash);
                if (proj) {
                    showProject(proj.id, false); 
                } else {
                    switchPage('projets', hashBtn1);
                }
            }
        }

        function reverseSort(btnElement) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active-sort'));
            if(btnElement) btnElement.classList.add('active-sort');
            
            sortDirection *= -1;
            allProjects.reverse();
            renderProjectsGrid();
        }

        function sortTable(column, btnElement) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active-sort'));
            if(btnElement) btnElement.classList.add('active-sort');

            if (currentSortColumn === column) {
                sortDirection *= -1; 
            } else {
                sortDirection = 1;
                currentSortColumn = column;
            }

            allProjects.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                if (!isNaN(valA) && !isNaN(valB)) { return (parseFloat(valA) - parseFloat(valB)) * sortDirection; }
                valA = valA.toString().toLowerCase(); valB = valB.toString().toLowerCase();
                if (valA < valB) return -1 * sortDirection;
                if (valA > valB) return 1 * sortDirection;
                return 0;
            });
            
            renderProjectsGrid(); 
        }

            card.innerHTML = `
                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%; margin-bottom: 25px;">
                    <div class="click-zone-inline" role="button" tabindex="0" aria-label="Profil précédent" onclick="moveTeamLightbox(-1); event.stopPropagation();" onkeydown="if(event.key === 'Enter') { moveTeamLightbox(-1); event.stopPropagation(); }">
                        <div class="arrow-icon icon-left" style="background-color: #ffffff;"></div>
                    </div>
                    
                    <div class="portrait-placeholder" style="width: 100%; max-width: 300px; aspect-ratio: 1 / 1; background: transparent;">
                        <img src="Images/Equipe/Profil_${member.index}.webp" class="blur-load" onload="this.classList.add('loaded')" alt="Portrait de ${member.name}" style="object-fit: cover; width: 100%; height: 100%;" width="800" height="800" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.onerror=null; this.style.display='none'; this.parentNode.innerHTML='PHOTO ${member.index}';}">
                    </div>
                    
                    <div class="click-zone-inline" role="button" tabindex="0" aria-label="Profil suivant" onclick="moveTeamLightbox(1); event.stopPropagation();" onkeydown="if(event.key === 'Enter') { moveTeamLightbox(1); event.stopPropagation(); }">
                        <div class="arrow-icon icon-right" style="background-color: #ffffff;"></div>
                    </div>
                </div>
                <div class="member-name">${member.name}</div>
                <div class="member-cv">${formattedBio}</div>
            `;
            card.scrollTop = 0;
        }

        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            const teamLightbox = document.getElementById('team-lightbox');
            if (lightbox && lightbox.classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') moveLightbox(1);
                if (e.key === 'ArrowLeft') moveLightbox(-1);
            } else if (teamLightbox && teamLightbox.classList.contains('active')) {
                if (e.key === 'Escape') closeTeamLightbox();
                if (e.key === 'ArrowRight') moveTeamLightbox(1);
                if (e.key === 'ArrowLeft') moveTeamLightbox(-1);
            }
        });

        function initMobileVignettesScroll() {
            const track = document.getElementById('vignettes-track');
            if (!track || window.innerWidth > 1300 || track.dataset.infinite !== 'true') return;

            const setWidth = track.scrollWidth / 3;
            if (setWidth > 0) {
                track.style.scrollBehavior = 'auto';
                track.scrollLeft = setWidth;
                track.style.scrollBehavior = '';
            }
        }

        function handleVignettesInfiniteScroll() {
            const track = document.getElementById('vignettes-track');
            if (!track || window.innerWidth > 1300 || track.dataset.infinite !== 'true') return;

            clearTimeout(vignettesScrollTimer);
            vignettesScrollTimer = setTimeout(() => {
                const setWidth = track.scrollWidth / 3;
                if (setWidth <= 0) return;

                if (track.scrollLeft >= setWidth * 2 - 5) {
                    track.style.scrollBehavior = 'auto';
                    track.scrollLeft -= setWidth;
                    track.style.scrollBehavior = '';
                } else if (track.scrollLeft <= 5) {
                    track.style.scrollBehavior = 'auto';
                    track.scrollLeft += setWidth;
                    track.style.scrollBehavior = '';
                }
            }, 120);
        }

        function renderVignettesCarousel() {
            const wrapperOuter = document.getElementById('vignettes-outer-container');
            const track = document.getElementById('vignettes-track');
            track.innerHTML = '';
            
            const otherProjects = allProjects.filter(p => p.id !== currentProjectId);
            
            if (otherProjects.length === 0) {
                if (wrapperOuter) wrapperOuter.style.display = 'none';
                return;
            }
            
            if (wrapperOuter) wrapperOuter.style.display = 'grid';

            const isInfinite = otherProjects.length > 3;
            track.dataset.infinite = isInfinite ? 'true' : 'false';
            const itemsToRender = isInfinite ? [...otherProjects, ...otherProjects, ...otherProjects] : otherProjects;

            itemsToRender.forEach(p => {
                track.innerHTML += `
                    <div class="vignette-slide" role="button" tabindex="0" onclick="showProject('${p.id}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') showProject('${p.id}')">
                        <div class="vignette-img-container">
                            <img src="Images/Projet/Projet ${p.id}/vignette_projet${p.id}.webp" class="blur-load" onload="this.classList.add('loaded')" alt="Parcourir le projet ${p.titre}" loading="lazy" width="800" height="800" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.onerror=null; this.closest('.vignette-slide').remove();}">
                        </div>
                    </div>`;
            });

            track.onscroll = handleVignettesInfiniteScroll;
            requestAnimationFrame(initMobileVignettesScroll);
        }

        function switchPage(pageName, urlHash = null) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-page'));
            document.getElementById('section-' + pageName).classList.add('active-page');
            
            document.getElementById('nav-projets').classList.remove('active');
            document.getElementById('nav-colline').classList.remove('active');

            if (pageName === 'projets') {
                document.getElementById('nav-projets').classList.add('active');
            } else if (pageName === 'colline') {
                document.getElementById('nav-colline').classList.add('active');
            } else if (pageName === 'projet-detail') {
                document.getElementById('nav-projets').classList.add('active');
                requestAnimationFrame(initMobileVignettesScroll);
            }
            
            document.getElementById('dynamic-contact-info').style.display = (pageName === 'colline') ? 'block' : 'none';
            
            if (urlHash) {
                history.pushState(null, null, '#' + urlHash);
            }
            
            updateSEO();
            window.scrollTo(0,0);
        }

        function moveCarousel(clickedZone, dir) {
            const vp = clickedZone.closest('.carousel-viewport');
            const track = vp.querySelector('.carousel-track');
            
            if (vp.getAttribute('data-is-animating') === 'true' || track.children.length <= 1) return;
            vp.setAttribute('data-is-animating', 'true');

            if (dir === 1) { 
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                track.style.transform = 'translateX(-100%)';
                setTimeout(() => {
                    track.style.transition = 'none';
                    track.appendChild(track.firstElementChild); 
                    track.style.transform = 'translateX(0)';
                    vp.setAttribute('data-is-animating', 'false');
                }, 400); 
            } else { 
                track.style.transition = 'none';
                track.insertBefore(track.lastElementChild, track.firstElementChild); 
                track.style.transform = 'translateX(-100%)'; 
                void track.offsetWidth; 
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                track.style.transform = 'translateX(0)'; 
                setTimeout(() => { vp.setAttribute('data-is-animating', 'false'); }, 400);
            }
        }

        function moveVignettes(dir) {
            const vp = document.querySelector('.vignettes-viewport');
            const track = document.getElementById('vignettes-track');

            if (window.innerWidth <= 1300) {
                if (track.dataset.infinite === 'true') {
                    const setWidth = track.scrollWidth / 3;
                    if (dir === 1 && track.scrollLeft >= setWidth * 2 - track.clientWidth) {
                        track.style.scrollBehavior = 'auto';
                        track.scrollLeft -= setWidth;
                        track.style.scrollBehavior = '';
                    } else if (dir === -1 && track.scrollLeft <= track.clientWidth) {
                        track.style.scrollBehavior = 'auto';
                        track.scrollLeft += setWidth;
                        track.style.scrollBehavior = '';
                    }
                }
                track.scrollBy({ left: dir * track.clientWidth, behavior: 'smooth' });
                return;
            }
            
            if (vp.getAttribute('data-is-animating') === 'true' || track.children.length <= 3) return;
            vp.setAttribute('data-is-animating', 'true');

            if (dir === 1) {
                track.style.transition = 'transform 0.6s ease-in-out';
                track.style.transform = 'translateX(-100%)'; 
                setTimeout(() => {
                    track.style.transition = 'none';
                    for(let i=0; i<3; i++) { track.appendChild(track.firstElementChild); }
                    track.style.transform = 'translateX(0)';
                    vp.setAttribute('data-is-animating', 'false');
                }, 600);
            } else {
                track.style.transition = 'none';
                for(let i=0; i<3; i++) { track.insertBefore(track.lastElementChild, track.firstElementChild); }
                track.style.transform = 'translateX(-100%)';
                void track.offsetWidth;
                track.style.transition = 'transform 0.6s ease-in-out';
                track.style.transform = 'translateX(0)';
                setTimeout(() => { vp.setAttribute('data-is-animating', 'false'); }, 600);
            }
        }
        
        function toggleSection(btn) {
            const wrapper = btn.closest('.expandable-wrapper');
            const content = wrapper.querySelector('.expandable-content');
            
            if (!wrapper.classList.contains('expanded')) {
                content.style.maxHeight = content.scrollHeight + 'px';
                wrapper.classList.add('expanded');
            } else {
                content.style.maxHeight = content.scrollHeight + 'px';
                void content.offsetWidth;
                content.style.maxHeight = '';
                wrapper.classList.remove('expanded');
                
                const rect = wrapper.getBoundingClientRect();
                if (rect.top < 0) {
                    window.scrollBy({ top: rect.top - 80, behavior: 'smooth' });
                }
            }
        }

        // INITIALISATION : Retrait du focus des lightboxes invisibles
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('#lightbox, #team-lightbox').forEach(lb => {
                lb.querySelectorAll('.close-btn, .click-zone, .click-zone-inline, [role="button"]').forEach(btn => btn.setAttribute('tabindex', '-1'));
            });
        });

        window.onload = () => { 
            loadColors(); 
            loadTypo(); 
            loadSEO(); 
            loadContact(); 
            loadReseaux();
            loadTeamProfiles();
            
            loadCoreData();
            
            window.addEventListener('popstate', () => {
                if(document.getElementById('intro-screen').style.display === 'none') {
                    if(document.getElementById('lightbox').classList.contains('active')) {
                        closeLightbox();
                    }
                    if(document.getElementById('team-lightbox') && document.getElementById('team-lightbox').classList.contains('active')) {
                        closeTeamLightbox();
                    }
                    handleHash();
                }
            });
        };
    </script>
</body>
</html>
