<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Atelier de la Colline - Architectes</title>
    <meta name="description" id="meta-desc" content="">
    <meta name="keywords" id="meta-keywords" content="">
    
    <link rel="preload" href="Typo/Lato/Lato-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="Typo/Lato/Lato-Bold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="Typo/Lato/Lato-Light.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="Typo/Lato/Lato-Black.ttf" as="font" type="font/ttf" crossorigin>
    
    <meta property="og:type" content="website">
    <meta property="og:title" id="og-title" content="">
    <meta property="og:description" id="og-desc" content="">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    
    <style>
        /* ==========================================================================
           0. VARIABLES DE COULEURS ET TYPOGRAPHIE DYNAMIQUES
           ========================================================================== */
        :root {
            --color-cadre: #12328a;  
            --color-action: #ff0000; 
            --color-fond: #ffffff;   
            --color-texte: #333333;  
            --color-titre: #000000;  

            --font-nav: 'Lato', sans-serif; --size-nav: 1.27rem; --weight-nav: 700; --transform-nav: uppercase; --style-nav: normal;
            --font-contact: 'Lato', sans-serif; --size-contact: 1rem; --weight-contact: 400; --transform-contact: uppercase; --style-contact: normal;
            --font-social: 'Lato', sans-serif; --size-social: 0.9rem; --weight-social: 700; --transform-social: uppercase; --style-social: normal;
            --font-table: 'Lato', sans-serif; --size-table: 0.81rem; --weight-table: 400; --weight-table-bold: 700; --transform-table: uppercase; --style-table: normal;
            
            --font-slogan-philo: 'Lato', sans-serif; --size-slogan-philo: 2.50rem; --weight-slogan-philo: 300; --transform-slogan-philo: none; --style-slogan-philo: italic;
            --font-slogan-projets: 'Lato', sans-serif; --size-slogan-projets: 2.50rem; --weight-slogan-projets: 300; --transform-slogan-projets: none; --style-slogan-projets: italic;
            
            --font-section-header: 'Lato', sans-serif; --size-section-header: 1rem; --weight-section-header: 700; --transform-section-header: uppercase; --style-section-header: normal;
            --font-project-sub: 'Lato', sans-serif; --size-project-sub: 1.27rem; --weight-project-sub: 700; --transform-project-sub: uppercase; --style-project-sub: normal;
            --font-key-points: 'Lato', sans-serif; --size-key-points: 0.9rem; --weight-key-points: 700; --transform-key-points: uppercase; --style-key-points: normal;
            --font-body-text: 'Lato', sans-serif; --size-body-text: 1.09rem; --weight-body-text: 400; --transform-body-text: none; --style-body-text: normal;
            --font-team-name: 'Lato', sans-serif; --size-team-name: 1.27rem; --weight-team-name: 900; --transform-team-name: uppercase; --style-team-name: normal;
            --font-cv: 'Lato', sans-serif; --size-cv: 1rem; --weight-cv: 400; --transform-cv: none; --style-cv: normal;
            
            --font-copyright: 'Lato', sans-serif; --size-copyright: 0.81rem; --weight-copyright: 400; --transform-copyright: none; --style-copyright: normal;
            --font-card-label: 'Lato', sans-serif; --size-card-label: 0.81rem; --weight-card-label: 700; --transform-card-label: uppercase; --style-card-label: normal;
            --font-card-value: 'Lato', sans-serif; --size-card-value: 0.81rem; --weight-card-value: 400; --transform-card-value: uppercase; --style-card-value: normal;
            --font-sort-bar: 'Lato', sans-serif; --size-sort-bar: 0.81rem; --weight-sort-bar: 700; --transform-sort-bar: uppercase; --style-sort-bar: normal;
            --font-btn-retour: 'Lato', sans-serif; --size-btn-retour: 1rem; --weight-btn-retour: 700; --transform-btn-retour: uppercase; --style-btn-retour: normal;
            --font-page-title: 'Lato', sans-serif; --size-page-title: 2.5rem; --weight-page-title: 700; --transform-page-title: uppercase; --style-page-title: normal;
            
            --sidebar-width: clamp(250px, calc((100vw - 1500px) / 2), 600px);
        }

        @font-face { font-family: 'Lato'; src: url('Typo/Lato/Lato-Light.ttf') format('truetype'); font-weight: 300; }
        @font-face { font-family: 'Lato'; src: url('Typo/Lato/Lato-Regular.ttf') format('truetype'); font-weight: 400; }
        @font-face { font-family: 'Lato'; src: url('Typo/Lato/Lato-Bold.ttf') format('truetype'); font-weight: 700; }
        @font-face { font-family: 'Lato'; src: url('Typo/Lato/Lato-Black.ttf') format('truetype'); font-weight: 900; }

        /* ==========================================================================
           1. RESPONSIVITÉ HOMOTHÉTIQUE ET MOBILE
           ========================================================================== */
        html { font-size: 11px; } 

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        h1, h2, h3, h4, h5, h6 { margin: 0; padding: 0; font-size: inherit; font-weight: inherit; font-family: inherit; line-height: inherit; text-transform: inherit; }
        .visually-hidden { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }

        body { font-family: 'Lato', sans-serif; font-weight: 400; font-size: 1rem; background-color: var(--color-fond); color: var(--color-texte); line-height: 1.4; display: flex; min-height: 100vh; text-transform: uppercase; transition: background-color 0.3s, color 0.3s; overflow-x: hidden; }

        /* --- ÉCRAN D'INTRODUCTION --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999;
            background-color: var(--color-fond); cursor: pointer; overflow: hidden; display: flex;
        }
        #intro-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            object-fit: cover; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #intro-logo-container {
            position: absolute; right: 30px; top: 20px;
            width: 16.36rem; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), width 0.8s;
            cursor: pointer;
        }
        
        #intro-logo-container:focus { outline: none; }
        #intro-logo-container:focus-visible {
            outline: 2px solid var(--color-action);
            outline-offset: 8px;
        }
        
        #sidebar-logo:focus { outline: none; }
        #sidebar-logo:focus-visible {
            outline: 2px solid var(--color-action);
            outline-offset: 8px;
        }

        .mask-logo {
            width: 100%; height: auto; aspect-ratio: 5/1;
            background-color: var(--color-texte); 
            -webkit-mask-image: url('Images/Icones/logo.png'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
            mask-image: url('Images/Icones/logo.png'); mask-size: contain; mask-repeat: no-repeat;
            transition: background-color 0.3s ease, -webkit-mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1), mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        #sidebar-logo .mask-logo {
            -webkit-mask-position: left center;
            mask-position: left center;
        }
        #intro-logo-container .mask-logo {
            -webkit-mask-position: right center;
            mask-position: right center;
        }
        #intro-logo-container .mask-logo.align-left {
            -webkit-mask-position: left center !important;
            mask-position: left center !important;
        }

        /* ==========================================================================
           2. LAYOUT : COLONNES ET GABARIT (DESKTOP)
           ========================================================================== */
        .sidebar { width: var(--sidebar-width); flex-shrink: 0; padding: 20px 30px; position: fixed; left: 0; top: 0; z-index: 100; height: 100vh; max-height: 100vh; overflow: hidden; border-right: 5px solid transparent; display: flex; flex-direction: column; }
        .main-content { margin-left: 0; width: 100%; display: flex; justify-content: center; padding: 20px var(--sidebar-width); position: relative; }
        .page-section { width: 1500px; max-width: 100%; padding: 0 30px; display: none; animation: fadeIn 0.4s ease-in-out; }

        .mobile-only { display: none; }
        .desktop-only { display: block; margin-top: auto; }

        @media (max-width: 1300px) {
            html { font-size: 11px; } 
            body { flex-direction: column; } 
            
            .sidebar { width: 100%; max-width: 100%; margin: 0; height: auto; max-height: none; position: relative; border-right: none; padding: 20px; overflow: visible; }
            .table-container { overflow-y: visible !important; margin-bottom: 40px; }

            .main-content { width: 100%; margin-left: 0; padding: 20px 0; }
            .page-section { padding: 0 20px; }
            
            .team-grid { grid-template-columns: 1fr; gap: 20px; }
            .projects-grid { grid-template-columns: 1fr 1fr !important; } 
            
            .main-nav { flex-wrap: wrap; }
            .project-header { flex-wrap: wrap; }
            .image-placeholder { height: 300px; } 

            .desktop-only { display: none !important; }
            .mobile-only { display: block; }
            .mobile-footer { width: 100%; max-width: 100%; margin: 0; padding: 0 20px 40px 20px; }
            
            /* Comportement de Swipe natif sur les carrousels (Mobile) */
            .carousel-viewport, .vignettes-viewport { overflow: visible; }
            .carousel-track, .vignettes-track {
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .carousel-track::-webkit-scrollbar, .vignettes-track::-webkit-scrollbar { display: none; }
            .slide { scroll-snap-align: start; flex-shrink: 0; }
            .vignette-slide { scroll-snap-align: start; flex: 0 0 75%; }
            
            /* Sur mobile, on cache les click-zones standards, mais on les force pour la lightbox */
            .click-zone { display: none !important; }
            .lightbox .click-zone { display: flex !important; } 

            .vignettes-wrapper { display: block; }
            .vignettes-viewport { width: 100%; }
        }

        @media (max-width: 600px) {
            .projects-grid { grid-template-columns: 1fr !important; } 
        }

        .page-section.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- LOGO BARRE LATÉRALE --- */
        #sidebar-logo { display: block; margin-bottom: 30px; text-decoration: none; width: 16.36rem; max-width: 100%; cursor: pointer; opacity: 0; transition: background-color 0.3s ease; }
        #sidebar-logo:hover .mask-logo { background-color: var(--color-action); }

        /* --- NAVIGATION --- */
        .main-nav { display: flex; gap: 20px; margin-bottom: 30px; font-family: var(--font-nav); font-size: var(--size-nav); font-weight: var(--weight-nav); text-transform: var(--transform-nav); font-style: var(--style-nav); }
        .main-nav a { text-decoration: none; color: var(--color-texte); padding-bottom: 2px; border-bottom: 5px solid transparent; transition: color 0.3s ease, border-color 0.3s ease; cursor: pointer;}
        .main-nav a:hover, .main-nav a:focus-visible { color: var(--color-action); border-bottom-color: var(--color-action); outline: none;}
        .main-nav a.active { color: var(--color-texte); border-bottom: 5px solid var(--color-texte); } 
        
        .info-block { margin-bottom: 40px; color: var(--color-texte); font-family: var(--font-contact); font-size: var(--size-contact); font-weight: var(--weight-contact); text-transform: var(--transform-contact); font-style: var(--style-contact); }
        
        .copyright { 
            margin-top: 20px; 
            font-family: var(--font-copyright); 
            font-size: var(--size-copyright); 
            font-weight: var(--weight-copyright); 
            text-transform: var(--transform-copyright); 
            font-style: var(--style-copyright); 
            color: var(--color-texte); 
        }

        /* --- RÉSEAUX SOCIAUX --- */
        .social-links { display: flex; gap: 15px; }
        .desktop-only .social-links { padding-top: 40px; margin-bottom: 20px; }
        .mobile-footer .social-links { margin-bottom: 20px; }
        .social-links a { text-decoration: none; color: var(--color-texte); border: 5px solid var(--color-texte); padding: 4px 8px; font-family: var(--font-social); font-size: var(--size-social); font-weight: var(--weight-social); text-transform: var(--transform-social); font-style: var(--style-social); transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease; }
        .social-links a:hover, .social-links a:active, .social-links a:focus-visible { background-color: var(--color-action); color: var(--color-fond); border-color: var(--color-action); outline: none;}

        /* --- BOUTONS DE TRI --- */
        .sort-bar-container {
            font-family: var(--font-sort-bar) !important;
            font-size: var(--size-sort-bar) !important;
            font-weight: var(--weight-sort-bar) !important;
            text-transform: var(--transform-sort-bar) !important;
            font-style: var(--style-sort-bar) !important;
        }
        .sort-btn { cursor: pointer; transition: color 0.3s ease; margin: 0 4px; }
        .sort-btn:hover, .sort-btn:focus-visible { color: var(--color-action); outline: none; }

        /* --- GRILLE DE FICHES PROJETS --- */
        .projects-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; margin-bottom: 80px; }
        
        .project-card { 
            display: flex; flex-direction: column; 
            background-color: #ffffff; 
            border: 1px solid var(--color-texte); 
            padding: 15px; 
            cursor: pointer; 
            transition: transform 0.3s ease, border-color 0.3s ease; 
            min-width: 0; 
        }
        .project-card:focus { outline: none; }
        .project-card:hover, .project-card:focus-visible { 
            transform: translateY(-5px); 
            border-color: var(--color-action); 
        }
        
        .card-img-wrapper { 
            width: 100%; aspect-ratio: 1/1; 
            overflow: hidden; 
            border: 1px solid var(--color-texte); 
            margin-bottom: 15px; 
            background-color: var(--color-fond); 
        }
        .card-img-wrapper img { 
            width: 100%; height: 100%; object-fit: cover; 
            display: block; 
        }

        .card-info { 
            display: flex; flex-direction: column; color: var(--color-texte);
        }
        
        .card-title-line { 
            display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
            border-bottom: 1px solid var(--color-texte); 
            padding-bottom: 6px; margin-bottom: 6px; 
            font-family: var(--font-project-sub); font-size: calc(var(--size-project-sub) * 0.85); font-weight: var(--weight-project-sub); text-transform: var(--transform-project-sub);
        }
        .card-title-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-title-line .card-id { color: var(--color-action); font-size: 1.1em; flex-shrink: 0; }
        
        .card-line { 
            display: flex; justify-content: space-between; 
            border-bottom: 1px dotted rgba(0,0,0,0.2); 
            padding: 4px 0; 
        }
        .card-line:last-child { border-bottom: none; padding-bottom: 0; }
        
        .card-label { 
            font-family: var(--font-card-label) !important;
            font-size: var(--size-card-label) !important;
            font-weight: var(--weight-card-label) !important;
            text-transform: var(--transform-card-label) !important;
            font-style: var(--style-card-label) !important;
            padding-right: 10px; flex-shrink: 0; 
        }
        
        .card-value { 
            font-family: var(--font-card-value) !important;
            font-size: var(--size-card-value) !important;
            font-weight: var(--weight-card-value) !important;
            text-transform: var(--transform-card-value) !important;
            font-style: var(--style-card-value) !important;
            text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; 
        }

        .card-subtitle-line {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dotted rgba(0,0,0,0.2); 
            padding: 4px 0; 
        }
        
        .card-value-subtitle {
            white-space: normal; 
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 65%;
            line-height: 1.3;
            height: calc(1.3em * 2); 
        }

        /* --- CONTENU --- */
        .blue-frame { background-color: var(--color-cadre); padding: 5px; position: relative; margin-bottom: 15px; transition: background-color 0.3s; }
        
        #colline-philo { 
            font-family: var(--font-slogan-philo) !important; 
            font-size: var(--size-slogan-philo) !important; 
            font-weight: var(--weight-slogan-philo) !important; 
            font-style: var(--style-slogan-philo) !important; 
            text-transform: var(--transform-slogan-philo) !important; 
            margin-top: 25px; margin-bottom: 25px; letter-spacing: -0.5px; color: var(--color-texte); 
        }
        
        #sommaire-text { 
            font-family: var(--font-slogan-projets) !important; 
            font-size: var(--size-slogan-projets) !important; 
            font-weight: var(--weight-slogan-projets) !important; 
            font-style: var(--style-slogan-projets) !important; 
            text-transform: var(--transform-slogan-projets) !important; 
            margin-top: 25px; margin-bottom: 25px; letter-spacing: -0.5px; color: var(--color-texte); 
        }
        
        .section-header { display: flex; justify-content: space-between; border-top: 1px solid var(--color-texte); border-bottom: 1px solid var(--color-texte); padding: 4px 0; margin-bottom: 30px; font-family: var(--font-section-header); font-size: var(--size-section-header); font-weight: var(--weight-section-header); text-transform: var(--transform-section-header); font-style: var(--style-section-header); color: var(--color-texte); }
        .text-block { column-gap: 40px; text-align: justify; margin-bottom: 30px; color: var(--color-texte); font-family: var(--font-body-text); font-size: var(--size-body-text); font-weight: var(--weight-body-text); text-transform: var(--transform-body-text); font-style: var(--style-body-text); }
        
        .image-placeholder, .portrait-placeholder { background-color: var(--color-fond); filter: brightness(0.95); background-image: radial-gradient(var(--color-texte) 1px, transparent 1px); background-size: 15px 15px; display: flex; align-items: center; justify-content: center; color: var(--color-texte); text-align: center; overflow: hidden; }
        .image-placeholder { height: 450px; font-size: 1.63rem; }
        .portrait-placeholder { height: 400px; font-size: 1.63rem; }
        .image-placeholder img, .portrait-placeholder img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* --- PROJETS & CARROUSEL --- */
        .project { margin-bottom: 40px; scroll-margin-top: 20px; }
        .project-header { display: flex; justify-content: space-between; border-top: 1px solid var(--color-texte); border-bottom: 1px solid var(--color-texte); padding: 4px 0; margin-bottom: 15px; font-family: var(--font-section-header); font-size: var(--size-section-header); font-weight: var(--weight-section-header); text-transform: var(--transform-section-header); font-style: var(--style-section-header); gap: 10px; color: var(--color-texte); }
        
        .carousel-viewport { width: 100%; aspect-ratio: 1.85 / 1; height: auto; background: none; border: none; padding: 0; margin-bottom: 15px; overflow: hidden; position: relative; }
        .carousel-track { height: 100%; display: flex; }
        .slide { min-width: 100%; height: 100%; background: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .slide img { width: 100%; height: 100%; object-fit: contain; }
        
        /* ZONES DE CLICS ET FLÈCHES DYNAMIQUES */
        .click-zone { position: absolute; top: 0; bottom: 0; width: 30%; z-index: 10; cursor: pointer; display: flex; align-items: center; }
        .zone-left { left: 0; justify-content: flex-start; }
        .zone-right { right: 0; justify-content: flex-end; }
        
        .arrow-icon { width: 1.75rem; height: 1.75rem; background-color: var(--color-texte); transition: background-color 0.3s ease; margin: 0 10px; }
        .arrow-small { width: 0.875rem; height: 0.875rem; } 
        
        .click-zone:focus { outline: none; }
        .click-zone:hover .arrow-icon, .click-zone:focus-visible .arrow-icon { background-color: var(--color-action); }

        .icon-left { -webkit-mask-image: url('Images/Icones/fleche_gauche.png'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; mask-image: url('Images/Icones/fleche_gauche.png'); mask-size: contain; mask-repeat: no-repeat; mask-position: center; }
        .icon-right { -webkit-mask-image: url('Images/Icones/fleche_droite.png'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; mask-image: url('Images/Icones/fleche_droite.png'); mask-size: contain; mask-repeat: no-repeat; mask-position: center; }

        .back-btn-container { display: flex; justify-content: center; margin-top: 40px; margin-bottom: 40px; }
        
        .back-btn {
            text-decoration: none; cursor: pointer; color: var(--color-texte); border: 5px solid var(--color-texte); padding: 8px 16px;
            font-family: var(--font-btn-retour) !important; font-size: var(--size-btn-retour) !important; font-weight: var(--weight-btn-retour) !important; text-transform: var(--transform-btn-retour) !important; font-style: var(--style-btn-retour) !important;
            transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        .back-btn:focus { outline: none; }
        .back-btn:hover, .back-btn:focus-visible { background-color: var(--color-action); color: var(--color-fond); border-color: var(--color-action); outline: none; }

        /* --- CARROUSEL VIGNETTES BAS DE PAGE --- */
        .vignettes-wrapper { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; margin-bottom: 50px;}
        .vignettes-viewport { width: calc(100% - 4rem); overflow: hidden; position: relative; } 
        .vignettes-track { display: flex; margin: 0 -10px; } 
        
        .vignette-slide { flex: 0 0 33.3333%; padding: 0 10px; box-sizing: border-box; cursor: pointer; }
        .vignette-slide:focus { outline: none; }
        .vignette-img-container { width: 100%; aspect-ratio: 1/1; overflow: hidden; }
        .vignette-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .vignette-slide:hover .vignette-img-container img, .vignette-slide:focus-visible .vignette-img-container img { transform: scale(1.05); }

        /* --- NOUVEAU : LIGHTBOX (ZOOM) FLUIDE --- */
        .lightbox {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .lightbox.active {
            opacity: 1; pointer-events: auto;
        }
        .lightbox-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); /* Assombrit la page */
            cursor: pointer;
        }
        .lightbox-content {
            position: relative; z-index: 10001; 
            width: 90vw; height: 90vh; /* Permet à l'image de "doubler" de taille */
            display: flex; align-items: center; justify-content: center;
            transform: scale(0.8); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .lightbox.active .lightbox-content {
            transform: scale(1);
        }
        /* Style des icones dans la lightbox (sur fond noir) */
        .lightbox .arrow-icon {
            background-color: #ffffff; 
        }
        .lightbox .close-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10005; cursor: pointer;
            width: 2rem; height: 2rem;
        }
        .lightbox .icon-close {
            width: 100%; height: 100%; background-color: #ffffff;
            -webkit-mask-image: url('Images/Icones/croix.png'); -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center;
            mask-image: url('Images/Icones/croix.png'); mask-size: contain; mask-repeat: no-repeat; mask-position: center;
            transition: background-color 0.3s ease;
        }
        
        .lightbox .close-btn:focus { outline: none; }
        .lightbox .close-btn:hover .icon-close, .lightbox .close-btn:focus-visible .icon-close,
        .lightbox .click-zone:hover .arrow-icon, .lightbox .click-zone:focus-visible .arrow-icon {
            background-color: var(--color-action);
        }

        @media (max-width: 1300px) {
            .lightbox .close-btn { top: -30px; right: 0; }
        }

        /* Textes sous le carrousel */
        .project-desc { display: flex; flex-direction: column; gap: 10px; }
        .project-desc-id { font-family: var(--font-project-sub); font-size: var(--size-project-sub); font-weight: var(--weight-project-sub); text-transform: var(--transform-project-sub); font-style: var(--style-project-sub); margin-bottom: 10px; color: var(--color-texte); }
        .key-points { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .key-item { display: flex; align-items: center; gap: 10px; font-family: var(--font-key-points); font-size: var(--size-key-points); font-weight: var(--weight-key-points); text-transform: var(--transform-key-points); font-style: var(--style-key-points); margin-bottom: 4px; color: var(--color-texte); }
        .dot { width: 5px; height: 5px; background-color: var(--color-texte); border-radius: 50%; flex-shrink: 0; }
        .project-text { text-align: justify; line-height: 1.5; color: var(--color-texte); font-family: var(--font-body-text); font-size: var(--size-body-text); font-weight: var(--weight-body-text); text-transform: var(--transform-body-text); font-style: var(--style-body-text); }
        .project-text p { margin-bottom: 15px; }

        /* --- COLLINE --- */
        #section-colline .blue-frame { background-color: transparent; border: none; padding: 0; margin-bottom: 25px; }
        #section-colline .image-placeholder { height: auto; background: none; padding: 0; }
        #section-colline .image-placeholder img { width: 100%; height: auto; display: block; }
        #section-colline .portrait-placeholder { width: 100%; aspect-ratio: 1 / 1; height: auto; background: none; padding: 0; }
        #section-colline .portrait-placeholder img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .member-name { font-family: var(--font-team-name); font-size: var(--size-team-name); font-weight: var(--weight-team-name); text-transform: var(--transform-team-name); font-style: var(--style-team-name); border-bottom: 1px solid var(--color-texte); padding-bottom: 5px; margin-bottom: 10px; color: var(--color-texte); }
        .member-cv { font-family: var(--font-cv); font-size: var(--size-cv); font-weight: var(--weight-cv); text-transform: var(--transform-cv); font-style: var(--style-cv); color: var(--color-texte); }
    </style>
</head>
<body>

    <h1 id="dynamic-h1" class="visually-hidden">Atelier de la Colline</h1>

    <div id="intro-screen" onclick="playIntro()">
        <img id="intro-bg" src="" alt="Atelier de la Colline - Image de couverture">
        
        <div id="intro-logo-container" role="button" tabindex="0" aria-label="Entrer sur le site" onkeydown="if(event.key === 'Enter' || event.key === ' ') { playIntro(); event.stopPropagation(); }">
            <div class="mask-logo"></div>
        </div>
    </div>

    <aside class="sidebar">
        <a id="sidebar-logo" role="button" tabindex="0" onclick="showIntro()" onkeydown="if(event.key === 'Enter') showIntro()"><div class="mask-logo"></div></a>
        
        <nav class="main-nav">
            <a id="nav-projets" role="button" tabindex="0" onkeydown="if(event.key === 'Enter') this.click()">PROJETS</a>
            <a id="nav-colline" role="button" tabindex="0" onkeydown="if(event.key === 'Enter') this.click()">LA COLLINE</a>
        </nav>
        
        <div class="info-block" id="dynamic-contact-info" style="display: none;"></div>
        
        <div class="desktop-only">
            <div class="social-links" style="margin-bottom: 20px;">
                <a href="https://www.instagram.com/atelier.de.la.colline/" target="_blank">INSTAGRAM</a>
                <a href="https://fr.linkedin.com" target="_blank">LINKEDIN</a>
            </div>
            <div class="copyright dynamic-copyright"></div>
        </div>
    </aside>

    <main class="main-content">
        <div id="section-projets" class="page-section">
            <h2 class="section-header" id="sommaire-header" style="display: none; margin-bottom: 20px;">
                <div id="sommaire-header-left"></div>
                <div id="sommaire-header-right"></div>
            </h2>
            
            <div id="sommaire-text" style="display: none;"></div>

            <h2 class="section-header sort-bar-container" style="margin-bottom: 30px; border-top: none; padding-top: 0; margin-top: 0;">
                <div>TRIER PAR : 
                    <span class="sort-btn" role="button" tabindex="0" onclick="sortTable('id')" onkeydown="if(event.key === 'Enter') this.click()">N°</span> | 
                    <span class="sort-btn" role="button" tabindex="0" onclick="sortTable('titre')" onkeydown="if(event.key === 'Enter') this.click()">TITRE</span> | 
                    <span class="sort-btn" role="button" tabindex="0" onclick="sortTable('type')" onkeydown="if(event.key === 'Enter') this.click()">TYPE</span> | 
                    <span class="sort-btn" role="button" tabindex="0" onclick="sortTable('lieu')" onkeydown="if(event.key === 'Enter') this.click()">LIEU</span> | 
                    <span class="sort-btn" role="button" tabindex="0" onclick="sortTable('annee')" onkeydown="if(event.key === 'Enter') this.click()">ANNÉE</span>
                </div>
            </h2>

            <div class="projects-grid" id="projects-grid"></div>
        </div>

        <div id="section-projet-detail" class="page-section">
            <div id="current-project-container"></div>
            
            <h2 class="section-header" id="vignettes-header" style="display: none; margin-top: 0;">
                <div id="vignettes-header-left"></div>
                <div id="vignettes-header-right"></div>
            </h2>

            <div class="vignettes-wrapper" id="bottom-carousel-wrapper" style="display: none;">
                <div class="click-zone" onclick="moveVignettes(-1)" style="position:relative; width:auto;">
                    <div class="arrow-icon arrow-small icon-left"></div>
                </div>
                <div class="vignettes-viewport" data-is-animating="false">
                    <div class="vignettes-track" id="vignettes-track"></div>
                </div>
                <div class="click-zone" onclick="moveVignettes(1)" style="position:relative; width:auto;">
                    <div class="arrow-icon arrow-small icon-right"></div>
                </div>
            </div>
        </div>

        <div id="section-colline" class="page-section">
            <section class="about-section">
                <h2 class="section-header"><div>01 PHILOSOPHIE</div><div>AGENCE</div></h2>
                <div id="colline-philo"></div>
            </section>
            
            <section class="about-section" id="approche-1">
                <h2 class="section-header"><div>02 NOTRE APPROCHE</div><div>VISION</div></h2>
                <div class="text-block" id="colline-approche-1"></div>
                <div id="photo-approche">
                    <div class="blue-frame image-placeholder">
                        <img src="Images/Approche/photo_approche.webp" alt="Atelier de la Colline - Notre approche et vision de l'architecture" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.style.display='none';}">
                    </div>
                </div>
                <div class="text-block" style="margin-top: 20px;" id="colline-approche-2"></div>
            </section>
            
            <section class="about-section">
                <h2 class="section-header"><div>03 L'ÉQUIPE</div><div>ASSOCIES</div></h2>
                <div class="team-grid" id="team-grid-container"></div>
            </section>
        </div>
    </main>

    <footer class="mobile-footer mobile-only">
        <div class="social-links">
            <a href="https://www.instagram.com/atelier.de.la.colline/" target="_blank">INSTAGRAM</a>
            <a href="https://fr.linkedin.com" target="_blank">LINKEDIN</a>
        </div>
        <div class="copyright dynamic-copyright"></div>
    </footer>

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <div class="lightbox-overlay" onclick="closeLightbox()"></div>
        <div class="lightbox-content">
            <div class="close-btn" role="button" tabindex="0" aria-label="Fermer" onclick="closeLightbox()" onkeydown="if(event.key === 'Enter') closeLightbox()">
                <div class="icon-close"></div>
            </div>
            
            <div class="click-zone zone-left" role="button" tabindex="0" aria-label="Image précédente" onclick="moveLightbox(-1)" onkeydown="if(event.key === 'Enter') moveLightbox(-1)">
                <div class="arrow-icon icon-left"></div>
            </div>
            <div class="click-zone zone-right" role="button" tabindex="0" aria-label="Image suivante" onclick="moveLightbox(1)" onkeydown="if(event.key === 'Enter') moveLightbox(1)">
                <div class="arrow-icon icon-right"></div>
            </div>
            
            <img id="lightbox-img" src="" alt="Image plein écran" style="max-width:100%; max-height:100%; object-fit:contain;" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}">
        </div>
    </div>

    <script>
        const seoData = { general: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" }, projets: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" }, colline: { title: "", desc: "", keys: "", h1: "", ogTitle: "", ogDesc: "", ogImage: "" } };
        
        let allProjects = []; 
        let currentProjectId = null; 
        
        let sortDirection = 1;
        let currentSortColumn = '';
        
        let hashBtn1 = 'projets';
        let hashBtn2 = 'colline';
        
        // Variables pour la Lightbox
        let currentLightboxIndex = 0;
        
        function slugify(text) {
            return text.toString().toLowerCase()
                .normalize('NFD') 
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/\s+/g, '-') 
                .replace(/[^\w\-]+/g, '') 
                .replace(/\-\-+/g, '-') 
                .replace(/^-+/, '') 
                .replace(/-+$/, ''); 
        }

        function setupIntro() {
            if(window.location.hash.replace('#', '') !== '') {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('sidebar-logo').style.opacity = '1';
                return;
            }
            
            document.getElementById('section-projets').classList.add('active-page');
            document.getElementById('nav-projets').classList.add('active');

            fetch('Texte/accueil.txt').then(r => r.text()).then(text => {
                const match = text.match(/Nombre de couvertures\s*:\s*(\d+)/i);
                const nbCouv = match ? parseInt(match[1]) : 3;
                const rand = Math.floor(Math.random() * nbCouv) + 1;
                
                const introBg = document.getElementById('intro-bg');
                introBg.dataset.tried = '';
                introBg.onerror = function() {
                    if(!this.dataset.tried) {
                        this.dataset.tried = '1';
                        this.src = `Images/Couverture/${rand}.jpg`;
                    } else {
                        this.src = `Images/Couverture/1.jpg`;
                    }
                };
                introBg.src = `Images/Couverture/${rand}.webp`;
            }).catch(e => {
                document.getElementById('intro-bg').src = `Images/Couverture/1.jpg`; 
            });
        }

        function showIntro() {
            const introScreen = document.getElementById('intro-screen');
            const introBg = document.getElementById('intro-bg');
            const introLogo = document.getElementById('intro-logo-container');
            const sidebarLogo = document.getElementById('sidebar-logo');
            const introMask = introLogo.querySelector('.mask-logo');
            
            history.pushState(null, null, window.location.pathname);
            
            introBg.style.transition = 'none';
            introLogo.style.transition = 'none';
            introMask.style.transition = 'none';
            introLogo.style.opacity = '0'; 
            
            introScreen.style.display = 'flex';
            introScreen.style.backgroundColor = 'transparent'; 

            fetch('Texte/accueil.txt').then(r => r.text()).then(text => {
                const match = text.match(/Nombre de couvertures\s*:\s*(\d+)/i);
                const nbCouv = match ? parseInt(match[1]) : 3;
                const rand = Math.floor(Math.random() * nbCouv) + 1;
                
                introBg.dataset.tried = '';
                introBg.onerror = function() {
                    if(!this.dataset.tried) {
                        this.dataset.tried = '1';
                        this.src = `Images/Couverture/${rand}.jpg`;
                    } else {
                        this.src = `Images/Couverture/1.jpg`;
                    }
                };
                introBg.src = `Images/Couverture/${rand}.webp`;
            }).catch(e => { introBg.src = `Images/Couverture/1.jpg`; });

            introLogo.style.transform = 'none'; 
            introLogo.style.width = '16.36rem'; 

            setTimeout(() => {
                const sRect = sidebarLogo.getBoundingClientRect();
                const iRect = introLogo.getBoundingClientRect();
                const tx = sRect.left - iRect.left;
                const ty = sRect.top - iRect.top;

                introBg.style.transform = 'translateX(-100vw)';
                introLogo.style.transform = `translate(${tx}px, ${ty}px)`;
                introLogo.style.width = `${sRect.width}px`;
                introMask.classList.add('align-left');
                
                introLogo.style.opacity = '1';
                sidebarLogo.style.opacity = '0';
                
                void introScreen.offsetWidth; 
                
                setTimeout(() => {
                    introBg.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    introLogo.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), width 0.8s';
                    introMask.style.transition = 'background-color 0.3s ease, -webkit-mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1), mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
                    
                    introBg.style.transform = 'translateX(0)';
                    introLogo.style.transform = 'none';
                    introLogo.style.width = '16.36rem';
                    introMask.classList.remove('align-left');

                    setTimeout(() => {
                        introScreen.style.backgroundColor = 'var(--color-fond)';
                    }, 800);
                }, 20); 
            }, 10);
        }

        function playIntro() {
            const introScreen = document.getElementById('intro-screen');
            const introBg = document.getElementById('intro-bg');
            const introLogo = document.getElementById('intro-logo-container');
            const sidebarLogo = document.getElementById('sidebar-logo');
            const introMask = introLogo.querySelector('.mask-logo');
            
            if (!introScreen || introScreen.style.display === 'none') return;
            
            introScreen.style.backgroundColor = 'transparent';

            introBg.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            introLogo.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), width 0.8s';
            introMask.style.transition = 'background-color 0.3s ease, -webkit-mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1), mask-position 0.8s cubic-bezier(0.25, 1, 0.5, 1)';

            const sRect = sidebarLogo.getBoundingClientRect();
            const iRect = introLogo.getBoundingClientRect();
            const tx = sRect.left - iRect.left;
            const ty = sRect.top - iRect.top;
            
            introBg.style.transform = 'translateX(-100vw)';
            introLogo.style.transform = `translate(${tx}px, ${ty}px)`;
            introLogo.style.width = `${sRect.width}px`; 
            introMask.classList.add('align-left');
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                sidebarLogo.style.opacity = '1';
                
                if(!window.location.hash.replace('#', '')) {
                    history.replaceState(null, null, '#' + hashBtn1);
                }
                handleHash();
            }, 800); 
        }

        function loadSEO() {
            fetch('Texte/seo.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                const blocks = text.split('[');
                blocks.forEach(block => {
                    if(!block.trim()) return;
                    const pageMatch = block.match(/^([^\]]+)\]/);
                    if(pageMatch) {
                        const pageKey = pageMatch[1].toLowerCase().trim();
                        
                        const titleMatch = block.match(/Titre\s*:\s*(.+)/i);
                        const descMatch = block.match(/Description\s*:\s*(.+)/i);
                        const keysMatch = block.match(/Keywords\s*:\s*(.+)/i);
                        
                        const h1Match = block.match(/H1\s*:\s*(.+)/i);
                        const ogTitleMatch = block.match(/OG-Titre\s*:\s*(.+)/i);
                        const ogDescMatch = block.match(/OG-Description\s*:\s*(.+)/i);
                        const ogImageMatch = block.match(/OG-Image\s*:\s*(.+)/i);

                        if(!seoData[pageKey]) seoData[pageKey] = {};
                        
                        if(titleMatch) seoData[pageKey].title = titleMatch[1].trim();
                        if(descMatch) seoData[pageKey].desc = descMatch[1].trim();
                        if(keysMatch) seoData[pageKey].keys = keysMatch[1].trim();
                        if(h1Match) seoData[pageKey].h1 = h1Match[1].trim();
                        if(ogTitleMatch) seoData[pageKey].ogTitle = ogTitleMatch[1].trim();
                        if(ogDescMatch) seoData[pageKey].ogDesc = ogDescMatch[1].trim();
                        if(ogImageMatch) seoData[pageKey].ogImage = ogImageMatch[1].trim();
                    }
                });
                updateSEO();
            }).catch(e => console.log("Fichier seo.txt non trouvé."));
        }

        function updateSEO() {
            const currentHash = window.location.hash.replace('#', '');
            
            let currentPageKey = 'projets';
            if (currentHash === hashBtn2) currentPageKey = 'colline';
            else if (currentHash && currentHash !== hashBtn1) currentPageKey = 'projets'; 
            
            const specific = seoData[currentPageKey] || {};
            const gen = seoData['general'] || {};
            
            document.title = specific.title || gen.title || "";
            document.getElementById('meta-desc').setAttribute('content', specific.desc || gen.desc || "");
            document.getElementById('meta-keywords').setAttribute('content', specific.keys || gen.keys || "");
            
            document.getElementById('dynamic-h1').innerText = specific.h1 || gen.h1 || specific.title || gen.title || "Atelier de la Colline";
            
            document.getElementById('og-title').setAttribute('content', specific.ogTitle || specific.title || gen.ogTitle || gen.title || "");
            document.getElementById('og-desc').setAttribute('content', specific.ogDesc || specific.desc || gen.ogDesc || gen.desc || "");
            document.getElementById('og-image').setAttribute('content', specific.ogImage || gen.ogImage || "Images/Couverture/1.webp");
            document.getElementById('og-url').setAttribute('content', window.location.href);
        }

        function loadTypo() {
            fetch('Typo/recap_typo.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                
                const normalizeStr = str => str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
                let fixedText = text.replace(/\r?\n\s*:/g, ' :').replace(/:\s*\r?\n\s*/g, ' : ');
                
                const mappings = { 
                    "menu principal": "nav", 
                    "bloc contact": "contact", 
                    "reseaux sociaux": "social", 
                    "texte philosophie": "slogan-philo", 
                    "texte projets": "slogan-projets",
                    "titre page": "page-title",
                    "en-tetes de section": "section-header", 
                    "sous-titres de projet": "project-sub", 
                    "points cles": "key-points", 
                    "corps de texte": "body-text", 
                    "nom du membre": "team-name", 
                    "biographie": "cv",
                    "copyright": "copyright",
                    "categorie fiche": "card-label",
                    "texte fiche": "card-value",
                    "tri projets": "sort-bar", 
                    "trie projets": "sort-bar",
                    "bouton retour": "btn-retour"
                };
                
                const parseWeight = (v) => { 
                    const lower = v.toLowerCase();
                    if (lower.includes('light')) return '300'; 
                    if (lower.includes('regular')) return '400'; 
                    if (lower.includes('bold')) return '700'; 
                    if (lower.includes('black')) return '900'; 
                    return '400'; 
                };
                
                let currentPrefix = null;
                
                fixedText.split('\n').forEach(line => {
                    if (!line.trim()) return;
                    
                    const cleanLine = normalizeStr(line);
                    let isSectionHeader = false;
                    let isProperty = false;
                    
                    for (const [key, prefix] of Object.entries(mappings)) { 
                        if (cleanLine.includes(key)) { 
                            currentPrefix = prefix; 
                            isSectionHeader = true;
                            break; 
                        } 
                    }
                    
                    if (cleanLine.includes("en-tetes (n°, titre...)") || cleanLine.includes("en-tetes (n, titre...)")) { currentPrefix = "table-header"; isSectionHeader = true; }
                    else if (cleanLine.includes("cellules classiques")) { currentPrefix = "table-cell"; isSectionHeader = true; }
                    else if (cleanLine.includes("titres du tableau")) { currentPrefix = "table-title"; isSectionHeader = true; }
                    
                    if (cleanLine.startsWith("-") || cleanLine.startsWith("police") || cleanLine.startsWith("taille") || cleanLine.startsWith("style")) {
                        isProperty = true;
                    }

                    if (!isSectionHeader && !isProperty) {
                        currentPrefix = null; 
                    }
                    
                    if (currentPrefix && isProperty) {
                        if (cleanLine.startsWith("- police") || cleanLine.startsWith("police")) {
                            const val = line.split(':')[1].trim(); 
                            const fontName = val.split(' ')[0].replace(/['"]/g, '');
                            const weight = parseWeight(val);
                            if (currentPrefix.startsWith("table-")) { 
                                document.documentElement.style.setProperty('--font-table', `'${fontName}', sans-serif`); 
                                if (currentPrefix === "table-header" || currentPrefix === "table-title") { 
                                    document.documentElement.style.setProperty('--weight-table-bold', weight); 
                                } else { 
                                    document.documentElement.style.setProperty('--weight-table', weight); 
                                } 
                            } 
                            else { 
                                document.documentElement.style.setProperty(`--font-${currentPrefix}`, `'${fontName}', sans-serif`); 
                                document.documentElement.style.setProperty(`--weight-${currentPrefix}`, weight); 
                            }
                        }
                        else if (cleanLine.startsWith("- taille") || cleanLine.startsWith("taille")) {
                            const size = cleanLine.match(/[\d.]+rem/);
                            if (size) document.documentElement.style.setProperty(`--size-${currentPrefix.startsWith("table-") ? "table" : currentPrefix}`, size[0]);
                        }
                        else if (cleanLine.startsWith("- style") || cleanLine.startsWith("style")) {
                            const val = cleanLine;
                            let target = currentPrefix.startsWith("table-") ? "table" : currentPrefix;
                            document.documentElement.style.setProperty(`--transform-${target}`, val.includes('majuscule') ? 'uppercase' : 'none');
                            document.documentElement.style.setProperty(`--style-${target}`, val.includes('italique') ? 'italic' : 'normal');
                        }
                    }
                });
            }).catch(e => console.log("Fichier recap_typo.txt non trouvé."));
        }

        function loadColors() {
            fetch('Couleur/couleur.txt?nocache=' + new Date().getTime()).then(r => r.text()).then(text => {
                text.split('\n').forEach(line => {
                    const parts = line.split(':');
                    if (parts.length >= 2) {
                        const name = parts[0].trim().toLowerCase();
                        let value = parts[1].trim().replace(/\s/g, ''); 
                        if (/^[0-9A-Fa-f]{3,6}$/.test(value)) value = '#' + value;
                        if (name.includes('cadre')) document.documentElement.style.setProperty('--color-cadre', value);
                        if (name.includes('action')) document.documentElement.style.setProperty('--color-action', value);
                        if (name.includes('fond')) document.documentElement.style.setProperty('--color-fond', value);
                        if (name.includes('texte')) document.documentElement.style.setProperty('--color-texte', value);
                        if (name.includes('titre')) document.documentElement.style.setProperty('--color-titre', value);
                    }
                });
            }).catch(e => console.log("Fichier couleur non trouvé."));
        }

        function loadContact() {
            fetch('Texte/contact.txt').then(r => r.text()).then(text => document.getElementById('dynamic-contact-info').innerHTML = text.replace(/\n/g, '<br>'));
        }

        function loadTeamProfiles() {
            fetch('Texte/equipe.txt').then(r => r.text()).then(text => {
                const container = document.getElementById('team-grid-container');
                container.innerHTML = "";
                text.split(/Profil \d+/i).filter(b => b.trim() !== "").forEach((block, i) => {
                    const name = block.match(/prénom et nom\s*:\s*(.+)/i)?.[1] || "NOM";
                    const bio = block.match(/présentation\s*:\s*([\s\S]+)/i)?.[1] || "";
                    const indexProfil = i + 1;
                    
                    container.innerHTML += `
                        <div class="team-member" id="team-member-${indexProfil}">
                            <div class="blue-frame">
                                <div class="portrait-placeholder">
                                    <img src="Images/Equipe/Profil_${indexProfil}.webp" alt="Portrait de ${name}" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.style.display='none'; this.parentNode.innerHTML='PHOTO ${indexProfil}';}">
                                </div>
                            </div>
                            <div class="member-name">${name}</div><div class="member-cv">${bio.replace(/\n/g, '<br>')}</div>
                        </div>`;
                });
            });
        }

        function loadCoreData() {
            Promise.all([
                fetch('Texte/accueil.txt').then(r=>r.text()).catch(e=>""),
                fetch('Texte/projets.txt').then(r=>r.text()).catch(e=>""),
                fetch('Texte/colline.txt').then(r=>r.text()).catch(e=>"")
            ]).then(([accueilText, projetsText, collineText]) => {
                
                if (accueilText) {
                    const btn1Match = accueilText.match(/Bouton\s*1\s*:\s*(.+)/i) || accueilText.match(/Bouton1\s*:\s*(.+)/i);
                    const btn2Match = accueilText.match(/Bouton\s*2\s*:\s*(.+)/i) || accueilText.match(/Bouton2\s*:\s*(.+)/i);
                    let btn1Text = btn1Match ? btn1Match[1].trim() : "PROJETS";
                    let btn2Text = btn2Match ? btn2Match[1].trim() : "LA COLLINE";
                    
                    document.getElementById('nav-projets').innerText = btn1Text;
                    document.getElementById('nav-colline').innerText = btn2Text;
                    
                    hashBtn1 = slugify(btn1Text);
                    hashBtn2 = slugify(btn2Text);
                    
                    document.getElementById('nav-projets').onclick = () => switchPage('projets', hashBtn1);
                    document.getElementById('nav-colline').onclick = () => switchPage('colline', hashBtn2);

                    const copyMatch = accueilText.match(/Sidebar - Copyright\s*:\s*([^\r\n]+)/i);
                    if (copyMatch) document.querySelectorAll('.dynamic-copyright').forEach(el => el.innerHTML = copyMatch[1].trim().replace(/\n/g, '<br>'));

                    const indexMatch = accueilText.match(/Section Projets - 01 Sommaire[\s\S]*?En-tête\s*:\s*([^\r\n]+)/i);
                    if (indexMatch) {
                        const parts = indexMatch[1].split('|');
                        document.getElementById('sommaire-header-left').innerText = parts[0] ? parts[0].trim() : '';
                        document.getElementById('sommaire-header-right').innerText = parts[1] ? parts[1].trim() : '';
                        document.getElementById('sommaire-header').style.display = 'flex';
                    }

                    const sommaireSection = accueilText.match(/Section Projets - 01 Sommaire[\s\S]*?(?=Section Projets - 02|$)/i);
                    if (sommaireSection) {
                        const textMatch = sommaireSection[0].match(/Texte\s*:\s*([^\r\n]+)/i);
                        if (textMatch) {
                            document.getElementById('sommaire-text').innerText = textMatch[1].trim();
                            document.getElementById('sommaire-text').style.display = 'block';
                        }
                    }

                    const carrouselMatch = accueilText.match(/Section Projets - 02 Carroussel[\s\S]*?En-tête\s*:\s*([^\r\n]+)/i);
                    if (carrouselMatch) {
                        const parts = carrouselMatch[1].split('|');
                        document.getElementById('vignettes-header-left').innerText = parts[0] ? parts[0].trim() : '';
                        document.getElementById('vignettes-header-right').innerText = parts[1] ? parts[1].trim() : '';
                    }

                    const nbCouvMatch = accueilText.match(/Nombre de couvertures\s*:\s*(\d+)/i);
                    const nbCouv = nbCouvMatch ? parseInt(nbCouvMatch[1]) : 3;
                    const rand = Math.floor(Math.random() * nbCouv) + 1;
                    const introBg = document.getElementById('intro-bg');
                    introBg.dataset.tried = '';
                    introBg.onerror = function() {
                        if(!this.dataset.tried) {
                            this.dataset.tried = '1';
                            this.src = `Images/Couverture/${rand}.jpg`;
                        } else {
                            this.src = `Images/Couverture/1.jpg`;
                        }
                    };
                    introBg.src = `Images/Couverture/${rand}.webp`;
                }

                if (projetsText) {
                    allProjects = []; 
                    projetsText.split(/Section Projets - /i).filter(b => b.trim() !== "").forEach((block) => {
                        if (block.toLowerCase().startsWith("projet")) {
                            allProjects.push({
                                id: block.match(/Projet\s+(\d+)/i)?.[1] || "0",
                                titre: block.match(/Titre\s*:\s*(.+)/i)?.[1] || "",
                                type: block.match(/Type\s*:\s*(.+)/i)?.[1] || "",
                                annee: block.match(/Année\s*:\s*(.+)/i)?.[1] || "",
                                lieu: block.match(/Lieu\s*:\s*(.+)/i)?.[1] || "",
                                client: block.match(/Client\s*:\s*(.+)/i)?.[1] || "",
                                etat: block.match(/(?:État|Etat)\s*:\s*(.+)/i)?.[1] || "",
                                budget: block.match(/Budget\s*:\s*(.+)/i)?.[1] || "",
                                surface: block.match(/Surface\s*:\s*(.+)/i)?.[1] || "",
                                sousTitre: block.match(/Sous-titre\s*:\s*(.+)/i)?.[1] || "",
                                nbImages: parseInt(block.match(/Nombre d'images\s*:\s*(\d+)/i)?.[1] || "3"),
                                paragraphs: (block.match(/Texte\s*:\s*([\s\S]+)/i)?.[1] || "").trim().split(/\n\s*\n/).map(p => `<p>${p.trim().replace(/\n/g, '<br>')}</p>`).join('')
                            });
                        }
                    });
                    renderProjectsGrid(); 
                    renderVignettesCarousel();
                }

                if (collineText) {
                    const philoMatch = collineText.match(/01 Philosophie[\s\S]*?Texte\s*:\s*([\s\S]*?)(?=Section La Colline - 02|$)/i);
                    if (philoMatch) document.getElementById('colline-philo').innerText = philoMatch[1].trim();
                    const appBloc1 = collineText.match(/Texte bloc 1\s*:\s*([\s\S]*?)(?=Texte bloc 2\s*:)/i);
                    if (appBloc1) document.getElementById('colline-approche-1').innerHTML = appBloc1[1].trim().replace(/\n/g, '<br>');
                    const appBloc2 = collineText.match(/Texte bloc 2\s*:\s*([\s\S]*?)(?=Section La Colline - 03|$)/i);
                    if (appBloc2) document.getElementById('colline-approche-2').innerHTML = appBloc2[1].trim().replace(/\n/g, '<br>');
                }

                if(window.location.hash.replace('#', '') !== '') {
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('sidebar-logo').style.opacity = '1';
                    handleHash();
                }
            });
        }

        function handleHash() {
            let currentHash = window.location.hash.replace('#', '');
            if (!currentHash) {
                switchPage('projets', hashBtn1);
                return;
            }

            if (currentHash === hashBtn1) {
                switchPage('projets', hashBtn1);
            } else if (currentHash === hashBtn2) {
                switchPage('colline', hashBtn2);
            } else {
                const proj = allProjects.find(p => slugify(p.titre) === currentHash);
                if (proj) {
                    showProject(proj.id, false); 
                } else {
                    switchPage('projets', hashBtn1);
                }
            }
        }

        function renderProjectsGrid() {
            const grid = document.getElementById('projects-grid');
            grid.innerHTML = '';
            
            allProjects.forEach(p => {
                let detailsHtml = '';
                
                detailsHtml += `
                    <div class="card-line card-subtitle-line">
                        <span class="card-label">Sous-titre</span>
                        <span class="card-value card-value-subtitle" title="${p.sousTitre || ''}">${p.sousTitre || ''}</span>
                    </div>`;
                
                const addField = (label, value) => {
                    if (value) {
                        detailsHtml += `<div class="card-line"><span class="card-label">${label}</span><span class="card-value" title="${value}">${value}</span></div>`;
                    }
                };
                
                addField('Type', p.type);
                addField('Année', p.annee);
                addField('Lieu', p.lieu);
                addField('Client', p.client);
                addField('État', p.etat);
                addField('Budget', p.budget);
                addField('Surface', p.surface);

                grid.innerHTML += `
                    <div class="project-card" role="button" tabindex="0" onclick="showProject('${p.id}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') showProject('${p.id}')">
                        <div class="card-img-wrapper">
                            <img src="Images/Projet/Projet ${p.id}/vignette_projet${p.id}.webp" alt="Projet ${p.titre}" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.style.display='none';}">
                        </div>
                        <div class="card-info">
                            <div class="card-title-line">
                                <h3 class="card-title-text">${p.titre}</h3><span class="card-id">${p.id}</span>
                            </div>
                            ${detailsHtml}
                        </div>
                    </div>`;
            });
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                sortDirection *= -1; 
            } else {
                sortDirection = 1;
                currentSortColumn = column;
            }

            allProjects.sort((a, b) => {
                let valA = a[column];
                let valB = b[column];
                if (!isNaN(valA) && !isNaN(valB)) { return (parseFloat(valA) - parseFloat(valB)) * sortDirection; }
                valA = valA.toString().toLowerCase(); valB = valB.toString().toLowerCase();
                if (valA < valB) return -1 * sortDirection;
                if (valA > valB) return 1 * sortDirection;
                return 0;
            });
            
            renderProjectsGrid(); 
        }

        function showProject(id, pushHistory = true) {
            currentProjectId = id;
            
            renderVignettesCarousel();
            
            const p = allProjects.find(proj => proj.id === id);
            if(!p) return;
            
            let slidesHtml = '';
            for (let i = 0; i < p.nbImages; i++) {
                // NOUVEAU : Clic sur l'image ouvre la Lightbox
                slidesHtml += `
                    <div class="slide">
                        <img src="Images/Projet/Projet ${p.id}/${i}.webp" alt="Architecture ${p.titre} - Photo ${i + 1}" loading="lazy" 
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.parentElement.remove();}"
                             onclick="openLightbox(${i})" style="cursor: zoom-in;" role="button" tabindex="0" onkeydown="if(event.key === 'Enter' || event.key === ' ') openLightbox(${i})">
                    </div>`;
            }

            const container = document.getElementById('current-project-container');
            container.innerHTML = `
                <article class="project" id="project-${p.id}">
                    <h2 class="project-header"><div>${p.id}</div><div>${p.titre}</div><div>${p.type}</div><div>${p.lieu}</div><div>${p.annee}</div></h2>
                    
                    <div class="carousel-viewport" style="margin-bottom:15px;" data-current-index="0" data-is-animating="false">
                        <div class="click-zone zone-left" onclick="moveCarousel(this, -1)">
                            <div class="arrow-icon icon-left"></div>
                        </div>
                        <div class="click-zone zone-right" onclick="moveCarousel(this, 1)">
                            <div class="arrow-icon icon-right"></div>
                        </div>
                        <div class="carousel-track">${slidesHtml}</div>
                    </div>
                    
                    <div class="project-desc">
                        <div class="project-desc-id">${p.sousTitre}</div>
                        <div class="key-points">
                            ${p.client ? `<div class="key-item"><div class="dot"></div> CLIENT : ${p.client}</div>` : ''}
                            ${p.etat ? `<div class="key-item"><div class="dot"></div> ÉTAT : ${p.etat}</div>` : ''}
                            ${p.budget ? `<div class="key-item"><div class="dot"></div> BUDGET : ${p.budget}</div>` : ''}
                            ${p.surface ? `<div class="key-item"><div class="dot"></div> SURFACE : ${p.surface}</div>` : ''}
                        </div>
                        <div class="project-text">${p.paragraphs}</div>
                        
                        <div class="back-btn-container">
                            <a class="back-btn" role="button" tabindex="0" onclick="switchPage('projets', hashBtn1)" onkeydown="if(event.key === 'Enter') this.click()">Retour à l'index</a>
                        </div>
                    </div>
                </article>`;
            
            const projSlug = slugify(p.titre);
            switchPage('projet-detail', pushHistory ? projSlug : null);
            
            document.getElementById('og-title').setAttribute('content', p.titre + " - Atelier de la Colline");
            if(p.sousTitre) document.getElementById('og-desc').setAttribute('content', p.sousTitre);
        }

        // --- NOUVEAU : FONCTIONS LIGHTBOX ---
        function openLightbox(index) {
            currentLightboxIndex = index;
            const lightbox = document.getElementById('lightbox');
            updateLightboxImage();
            lightbox.classList.add('active');
            lightbox.setAttribute('aria-hidden', 'false');
            document.querySelector('.lightbox .close-btn').focus();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.remove('active');
            lightbox.setAttribute('aria-hidden', 'true');
        }

        function moveLightbox(dir) {
            const p = allProjects.find(proj => proj.id === currentProjectId);
            if(!p) return;
            currentLightboxIndex += dir;
            if (currentLightboxIndex < 0) currentLightboxIndex = p.nbImages - 1;
            if (currentLightboxIndex >= p.nbImages) currentLightboxIndex = 0;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            const p = allProjects.find(proj => proj.id === currentProjectId);
            if(!p) return;
            const lbImg = document.getElementById('lightbox-img');
            
            lbImg.dataset.tried = ''; 
            lbImg.src = `Images/Projet/Projet ${p.id}/${currentLightboxIndex}.webp`;
        }

        // Navigation clavier pour la Lightbox
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (lightbox && lightbox.classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') moveLightbox(1);
                if (e.key === 'ArrowLeft') moveLightbox(-1);
            }
        });
        // --- FIN FONCTIONS LIGHTBOX ---

        function renderVignettesCarousel() {
            const wrapper = document.getElementById('bottom-carousel-wrapper');
            const track = document.getElementById('vignettes-track');
            track.innerHTML = '';
            
            const otherProjects = allProjects.filter(p => p.id !== currentProjectId);
            
            if(otherProjects.length === 0) {
                wrapper.style.display = 'none';
                document.getElementById('vignettes-header').style.display = 'none';
                return;
            }
            
            wrapper.style.display = 'flex';
            document.getElementById('vignettes-header').style.display = 'flex';

            otherProjects.forEach(p => {
                track.innerHTML += `
                    <div class="vignette-slide" role="button" tabindex="0" onclick="showProject('${p.id}')" onkeydown="if(event.key === 'Enter' || event.key === ' ') showProject('${p.id}')">
                        <div class="vignette-img-container">
                            <img src="Images/Projet/Projet ${p.id}/vignette_projet${p.id}.webp" alt="Parcourir le projet ${p.titre}" loading="lazy" onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src=this.src.replace('.webp', '.jpg');}else{this.src='Custom/fallback.jpg';}">
                        </div>
                    </div>`;
            });
        }

        function switchPage(pageName, urlHash = null) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-page'));
            document.getElementById('section-' + pageName).classList.add('active-page');
            
            document.getElementById('nav-projets').classList.remove('active');
            document.getElementById('nav-colline').classList.remove('active');

            if (pageName === 'projets') {
                document.getElementById('nav-projets').classList.add('active');
            } else if (pageName === 'colline') {
                document.getElementById('nav-colline').classList.add('active');
            }
            else if (pageName === 'projet-detail') {
                document.getElementById('nav-projets').classList.add('active');
            }
            
            document.getElementById('dynamic-contact-info').style.display = (pageName === 'colline') ? 'block' : 'none';
            
            if (urlHash) {
                history.pushState(null, null, '#' + urlHash);
            }
            
            updateSEO();
            window.scrollTo(0,0);
        }

        function moveCarousel(clickedZone, dir) {
            const vp = clickedZone.closest('.carousel-viewport');
            const track = vp.querySelector('.carousel-track');
            
            if (vp.getAttribute('data-is-animating') === 'true' || track.children.length <= 1) return;
            vp.setAttribute('data-is-animating', 'true');

            if (dir === 1) { 
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                track.style.transform = 'translateX(-100%)';
                setTimeout(() => {
                    track.style.transition = 'none';
                    track.appendChild(track.firstElementChild); 
                    track.style.transform = 'translateX(0)';
                    vp.setAttribute('data-is-animating', 'false');
                }, 400); 
            } else { 
                track.style.transition = 'none';
                track.insertBefore(track.lastElementChild, track.firstElementChild); 
                track.style.transform = 'translateX(-100%)'; 
                void track.offsetWidth; 
                track.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';
                track.style.transform = 'translateX(0)'; 
                setTimeout(() => { vp.setAttribute('data-is-animating', 'false'); }, 400);
            }
        }

        function moveVignettes(dir) {
            const vp = document.querySelector('.vignettes-viewport');
            const track = document.getElementById('vignettes-track');
            
            if (vp.getAttribute('data-is-animating') === 'true' || track.children.length <= 3) return;
            vp.setAttribute('data-is-animating', 'true');

            if (dir === 1) {
                track.style.transition = 'transform 0.6s ease-in-out';
                track.style.transform = 'translateX(-100%)'; 
                setTimeout(() => {
                    track.style.transition = 'none';
                    for(let i=0; i<3; i++) { track.appendChild(track.firstElementChild); }
                    track.style.transform = 'translateX(0)';
                    vp.setAttribute('data-is-animating', 'false');
                }, 600);
            } else {
                track.style.transition = 'none';
                for(let i=0; i<3; i++) { track.insertBefore(track.lastElementChild, track.firstElementChild); }
                track.style.transform = 'translateX(-100%)';
                void track.offsetWidth;
                track.style.transition = 'transform 0.6s ease-in-out';
                track.style.transform = 'translateX(0)';
                setTimeout(() => { vp.setAttribute('data-is-animating', 'false'); }, 600);
            }
        }

        window.onload = () => { 
            loadColors(); 
            loadTypo(); 
            loadSEO(); 
            loadContact(); 
            loadTeamProfiles();
            
            loadCoreData();
            
            window.addEventListener('popstate', () => {
                if(document.getElementById('intro-screen').style.display === 'none') {
                    // Fermer la lightbox si on utilise "précédent" sur le navigateur
                    if(document.getElementById('lightbox').classList.contains('active')) {
                        closeLightbox();
                    }
                    handleHash();
                }
            });
        };
    </script>
</body>
</html>
